name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Each component is independent; jobs run in parallel. Feel free to add
# path filters (e.g. dorny/paths-filter) as the project grows.
jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go test ./...

  rule-engine:
    name: Rule engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rule_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rule_engine/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend-new]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
