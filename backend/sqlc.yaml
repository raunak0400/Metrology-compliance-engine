version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.NullUUID"
            nullable: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: { type: "time.Time", pointer: true }
            nullable: true
          # json.RawMessage (not plain []byte): encoding/json base64-encodes a
          # bare []byte field, which would turn every JSONB column into an
          # unusable base64 string in API responses instead of nested JSON.
          # json.RawMessage's MarshalJSON/UnmarshalJSON pass the bytes through
          # as-is. Same underlying type as []byte, so dbutil.JSONBytes and
          # every existing json.Unmarshal(x.Field, ...) call site still work
          # unchanged (Go assignability: one side unnamed = no conversion needed).
          - db_type: "jsonb"
            go_type: { type: "encoding/json.RawMessage" }
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "numeric"
            go_type: { type: "float64", pointer: true }
            nullable: true
