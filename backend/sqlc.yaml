version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.NullUUID"
            nullable: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: { type: "time.Time", pointer: true }
            nullable: true
          - db_type: "jsonb"
            go_type: { type: "[]byte" }
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "numeric"
            go_type: { type: "float64", pointer: true }
            nullable: true
